# ==============================================================================
# KONFIGURASI ENVIRONMENT: DEVELOPMENT (LOKAL / PENGEMBANGAN)
# Standar: The Twelve-Factor App (III. Config) & SNI ISO/IEC 27001
# ==============================================================================

[environment]
name = development
code = dev
description = Environment pengembangan lokal dan debugging modul database
is_production = false
debug_mode = true
allow_demo_accounts = true

[database]
host = localhost
port = 3306
dbname = apotek
charset = utf8mb4
connect_timeout = 5
read_timeout = 10
autocommit = false
ssl_required = false
log_level = DEBUG

[auth]
default_admin_user = admin.pusat
auth_method = mariadb_native_password
session_timeout_minutes = 120

[logging]
log_level = DEBUG
log_format = [%(asctime)s] [%(levelname)s] [%(name)s.%(module)s]: %(message)s
log_to_file = true
log_file = docs/dev_app.log
max_bytes = 5242880
backup_count = 3

[performance]
max_connections = 20
latency_threshold_warning_ms = 150
latency_threshold_critical_ms = 400
