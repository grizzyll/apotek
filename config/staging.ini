# ==============================================================================
# KONFIGURASI ENVIRONMENT: STAGING (SERVER UJI / AUDIT / UAT)
# Standar: The Twelve-Factor App (III. Config) & SNI ISO/IEC 27001
# ==============================================================================

[environment]
name = staging
code = staging
description = Server uji coba integrasi, simulasi migrasi patch, UAT, dan sertifikasi
is_production = false
debug_mode = false
allow_demo_accounts = true

[database]
host = localhost
port = 3306
dbname = apotek_staging
charset = utf8mb4
connect_timeout = 5
read_timeout = 10
autocommit = false
ssl_required = false
log_level = INFO

[auth]
default_admin_user = admin.pusat
auth_method = mariadb_native_password
session_timeout_minutes = 60

[logging]
log_level = INFO
log_format = [%(asctime)s] [%(levelname)s] [%(name)s.%(module)s]: %(message)s
log_to_file = true
log_file = docs/staging_app.log
max_bytes = 10485760
backup_count = 5

[performance]
max_connections = 50
latency_threshold_warning_ms = 100
latency_threshold_critical_ms = 300
