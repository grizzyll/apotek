# ==============================================================================
# KONFIGURASI ENVIRONMENT: PRODUCTION (SERVER LIVE / PRODUKSI 5 CABANG)
# Standar: The Twelve-Factor App (III. Config) & SNI ISO/IEC 27001
# ==============================================================================

[environment]
name = production
code = prod
description = Server produksi operasional live 5 cabang apotek PT Sehat Bersama Farma
is_production = true
debug_mode = false
allow_demo_accounts = false

[database]
host = localhost
port = 3306
dbname = apotek_prod
charset = utf8mb4
connect_timeout = 3
read_timeout = 5
autocommit = false
ssl_required = true
ssl_ca = config/ca-cert.pem
log_level = WARNING

[auth]
default_admin_user = admin.pusat
auth_method = mariadb_native_password
session_timeout_minutes = 15

[logging]
log_level = WARNING
log_format = [%(asctime)s] [%(levelname)s] [PROD_AUDIT]: %(message)s
log_to_file = true
log_file = docs/prod_app.log
max_bytes = 52428800
backup_count = 10

[performance]
max_connections = 150
latency_threshold_warning_ms = 50
latency_threshold_critical_ms = 200
